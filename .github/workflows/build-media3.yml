name: Compile Jetpack Media3 Demo APK

on:
  workflow_dispatch: # Allows you to start the build with a click

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Media3 Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile Media3 Demo APK
        run: |
          ./gradlew :demo:assembleNoDecoderExtensionsDebug --stacktrace

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: Media3-Demo-APK
          path: demos/main/buildout/outputs/apk/**/*.apk
